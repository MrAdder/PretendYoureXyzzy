name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure local master ref exists
        run: git rev-parse --verify master >/dev/null 2>&1 || git branch master origin/master

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Prepare build.properties
        run: cp build.properties.example build.properties

      - name: Build with Maven
        run: mvn -B verify -Dmaven.buildNumber.doCheck=false -Dmaven.buildNumber.doUpdate=false
