status = error

appender.console.type = Console
appender.console.name = stdout
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d [%t] %-5p %c - %m%n

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = stdout

# Hibernate 6's javax.persistence -> jakarta.persistence legacy-setting fallback lookup logs a
# deprecation warning on every check, even when nothing is actually configured via the old key.
logger.hibernateDeprecation.name = org.hibernate.orm.deprecation
logger.hibernateDeprecation.level = error
logger.hibernateDeprecation.appenderRef.stdout.ref = stdout

